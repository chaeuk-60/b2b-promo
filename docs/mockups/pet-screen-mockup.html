<title>커푸 펫 화면</title>
<style>
  :root {
    --bg: #faf5f0;
    --surface: #ffffff;
    --border: #f0dfe2;
    --text: #4a3a3d;
    --muted: #a68a8f;
    --accent: #ff8fa6;
    --accent-soft: #ffe3ea;
    --nav-bg: #fff0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #221a1c;
      --surface: #2c2225;
      --border: #3d2e31;
      --text: #f2e6e8;
      --muted: #b89ba0;
      --accent: #ff8fa6;
      --accent-soft: #4a2e34;
      --nav-bg: #2c2225;
    }
  }
  :root[data-theme="dark"] {
    --bg: #221a1c;
    --surface: #2c2225;
    --border: #3d2e31;
    --text: #f2e6e8;
    --muted: #b89ba0;
    --accent: #ff8fa6;
    --accent-soft: #4a2e34;
    --nav-bg: #2c2225;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", sans-serif;
    padding: 24px;
  }
  .screen {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  nav {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 18px;
    background: var(--nav-bg);
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-weight: 600;
  }
  nav .back { color: var(--muted); font-weight: 400; }

  .info {
    display: flex;
    justify-content: center;
    padding: 18px 20px 4px;
  }
  .info .name { font-size: 18px; font-weight: 700; }
  .status-row { padding: 0 20px 10px; font-size: 13px; color: var(--muted); text-align: center; }
  .status-row b { color: var(--text); font-weight: 600; }

  .stage-area { display: none; } /* 말풍선을 펫 위로 옮기면서 이 자리는 더 이상 사용 안 함 */

  /* 풀밭/정원 배경 - 픽셀 아트 SVG (벡터지만 crispEdges 사각형이라 확대해도 각지게 유지됨) */
  .meadow {
    position: relative;
    height: 190px;
    margin: 4px 16px 18px;
    /* overflow: hidden을 여기 두면 펫이 왼쪽 끝에 있을 때 말풍선이 잘려서, 배경에만 둥근 모서리 클리핑을 적용 */
  }
  .meadow-bg-wrap { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; }
  .meadow-bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .pet-wander {
    position: absolute;
    bottom: 40px;
    /* px 대신 %로 이동해서 배경(.meadow) 폭이 바뀌어도 항상 배경 폭 기준으로 자동으로 좌우 끝까지 오가도록 함 */
    left: 17%;
    animation: wander 14s infinite;
  }
  /* 픽셀아트 말풍선: CSS border는 박스의 원래 4변에만 그려지고, clip-path가 만들어내는 계단(꼬리) 안쪽 변에는
     테두리가 자동으로 생기지 않는다(그래서 꼬리 옆면이 테두리 없이 잘려 보였음). 그래서 border 대신
     "같은 모양의 clip-path를 쓰는 두 박스(회색 박스 위에 흰 박스를 2px 작게 얹기)"로 테두리를 흉내낸다 -
     두 박스 모두 같은 비율(모서리 6px, 꼬리 9/6/3px)의 윤곽선을 쓰므로 어디를 잘라도 회색 테두리가 고르게 남는다. */
  .bubble {
    position: absolute;
    bottom: 100%;
    /* 펫 스프라이트 기준 가운데 정렬. 잘림은 .pet-wander의 시작 위치(left)를 안쪽으로 들여서 방지 */
    left: 50%;
    transform: translateX(-50%);
    margin-bottom: 20px;
    z-index: 2;
  }
  .bubble-frame,
  .bubble-body {
    /* 위쪽 모서리는 계단 컷, 아래쪽은 가운데만 3단으로 좁아지며 꼬리로 이어지는 하나의 윤곽선.
       두 요소가 같은 식을 쓰되 크기만 2px 차이나므로 결과적으로 2px 두께 테두리처럼 보인다. */
    clip-path: polygon(
      6px 0, calc(100% - 6px) 0, 100% 6px,
      100% calc(100% - 9px),
      calc(50% + 9px) calc(100% - 9px), calc(50% + 9px) calc(100% - 6px),
      calc(50% + 6px) calc(100% - 6px), calc(50% + 6px) calc(100% - 3px),
      calc(50% + 3px) calc(100% - 3px), calc(50% + 3px) 100%,
      calc(50% - 3px) 100%, calc(50% - 3px) calc(100% - 3px),
      calc(50% - 6px) calc(100% - 3px), calc(50% - 6px) calc(100% - 6px),
      calc(50% - 9px) calc(100% - 6px), calc(50% - 9px) calc(100% - 9px),
      0 calc(100% - 9px), 0 6px
    );
  }
  .bubble-frame {
    display: inline-block;
    background: #a8a8a8; /* 테두리 색 = 회색 박스 그 자체 */
    padding: 2px; /* 이 2px가 곧 테두리 두께가 됨 */
  }
  .bubble-body {
    display: block;
    /* 테마 무관하게 항상 흰 바탕 고정 - 말풍선은 항상 하얀색 유지 */
    background: #fff;
    color: #555555;
    font-size: 12px;
    font-family: "Courier New", monospace;
    padding: 6px 10px 15px; /* 아래쪽 9px은 꼬리가 차지할 자리(6px 기본 + 9px 꼬리 높이) */
    white-space: nowrap;
  }
  .pet-hop {
    animation: flip 14s linear infinite; /* 방향 전환(좌우 반전) 전용 레이어 */
  }
  .pet-bounce {
    animation: bounce 1s steps(1, jump-end) infinite; /* 통통 튀는 효과 전용 레이어(transform이라 margin collapse 없음) */
  }
  .pet-sprite { width: 64px; height: 64px; image-rendering: pixelated; display: block; }

  /* 좌우 총총 이동: 각 구간에 steps()를 걸어 부드럽게 미끄러지지 않고 픽셀 단위로 딱딱 끊어 이동.
     40~76% 구간은 완전히 멈춰있음. transform(px) 대신 left(%)로 이동해서 배경 폭에 맞춰 자동으로 좌우 끝까지 오가게 함.
     방향전환(좌우 반전)은 말풍선이 아니라 캐릭터(.pet-hop)에만 걸어서 말풍선 글자가 안 뒤집히게 함. */
  /* 14초 주기: 0~40%(5.6초) 오른쪽으로 6걸음, 40~70%(4.2초) 정지, 70~100%(4.2초) 왼쪽으로 복귀.
     한 걸음에 ~0.9초 정도로 옛날 다마고치처럼 느리고 또렷하게 끊어 이동. */
  @keyframes wander {
    0%   { left: 17%; animation-timing-function: steps(1, jump-end); }
    7%   { left: 25%; animation-timing-function: steps(1, jump-end); }
    14%  { left: 33%; animation-timing-function: steps(1, jump-end); }
    20%  { left: 41%; animation-timing-function: steps(1, jump-end); }
    27%  { left: 49%; animation-timing-function: steps(1, jump-end); }
    34%  { left: 57%; animation-timing-function: steps(1, jump-end); }
    40%  { left: 65%; animation-timing-function: steps(1, jump-end); }
    70%  { left: 65%; animation-timing-function: steps(1, jump-end); } /* 정지 구간 */
    75%  { left: 57%; animation-timing-function: steps(1, jump-end); }
    80%  { left: 49%; animation-timing-function: steps(1, jump-end); }
    85%  { left: 41%; animation-timing-function: steps(1, jump-end); }
    90%  { left: 33%; animation-timing-function: steps(1, jump-end); }
    95%  { left: 25%; animation-timing-function: steps(1, jump-end); }
    100% { left: 17%; }
  }
  /* 통통 튀는 것도 부드러운 ease 곡선이 아니라 steps()로 딱딱 끊어서(고전 도트 게임 점프처럼) 이동 */
  @keyframes bounce {
    0%   { transform: translateY(0); }
    25%  { transform: translateY(-4px); }
    50%  { transform: translateY(-8px); }
    75%  { transform: translateY(-4px); }
    100% { transform: translateY(0); }
  }
  @keyframes flip {
    0%, 69%  { transform: scaleX(1); }
    70%, 100% { transform: scaleX(-1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pet-wander, .pet-hop, .pet-bounce { animation: none; }
  }

  /* 눈 깜빡임: opacity 페이드 대신 눈동자 위에서 아래로 살색 사각형이 10px(그리드 한 칸) 단위로 계단식으로
     자라나 덮었다가 다시 줄어들게 해서, 부드럽게 감기지 않고 픽셀 단위로 뚝뚝 감기는 느낌을 냄
     (실제로는 "감은 눈" 프레임 이미지로 교체 예정) */
  .blink-eye { fill: #ffdde0; height: 0; animation: blink 4.5s infinite; }
  @keyframes blink {
    0%, 91%   { height: 0px;  animation-timing-function: steps(1, jump-end); }
    92%       { height: 10px; animation-timing-function: steps(1, jump-end); } /* 한 칸 감김 */
    93%       { height: 20px; animation-timing-function: steps(1, jump-end); } /* 두 칸 감김 */
    94%, 96%  { height: 30px; animation-timing-function: steps(1, jump-end); } /* 완전히 감음 */
    97%       { height: 20px; animation-timing-function: steps(1, jump-end); } /* 뜨는 중 */
    98%       { height: 10px; animation-timing-function: steps(1, jump-end); }
    99%, 100% { height: 0px; }
  }
  @media (prefers-reduced-motion: reduce) { .blink-eye { animation: none; } }

  .actions {
    display: flex;
    gap: 8px;
    padding: 0 20px 8px;
    position: relative;
  }
  button {
    flex: 1;
    padding: 11px 0;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  .food-menu {
    margin: 0 20px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .food-menu .menu-label {
    padding: 8px 14px;
    font-size: 11px;
    color: var(--muted);
    background: var(--nav-bg);
  }
  .food-menu button {
    display: block;
    width: 100%;
    text-align: left;
    border-radius: 0;
    border: none;
    border-top: 1px solid var(--border);
    padding: 12px 14px;
    font-size: 13px;
    font-weight: 500;
  }
  .food-menu button:disabled { color: var(--muted); cursor: not-allowed; }
  .food-menu button .hint { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }

  .fortune-row { padding: 4px 20px 20px; }
  .fortune-row button { width: 100%; }
</style>
